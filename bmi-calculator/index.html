<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern bilingual BMI Calculator built with HTML, CSS and JavaScript.">
    <meta name="theme-color" content="#5b5cf0">
    <title>BMI Calculator | محاسبه‌گر BMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="hero">
            <div class="brand">
                <span class="eyebrow" data-i18n="eyebrow">ابزار سلامت</span>
                <h1 data-i18n="title">محاسبه‌گر BMI</h1>
                <p data-i18n="subtitle">شاخص توده بدنی خود را در چند ثانیه محاسبه کنید.</p>
            </div>

            <div class="header-actions">
                <button class="language-toggle" id="languageToggle" type="button" aria-label="Change language">
                    <span id="languageIcon">EN</span>
                </button>
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
                    <span id="themeIcon">☾</span>
                </button>
            </div>
        </header>

        <section class="calculator-card">
            <form id="bmiForm" novalidate>
                <div class="fields">
                    <div class="field">
                        <label for="weight" data-i18n="weightLabel">وزن</label>
                        <div class="input-wrap">
                            <input id="weight" type="number" min="1" max="500" step="0.1"
                                   placeholder="مثلاً 70" data-placeholder="weightPlaceholder"
                                   autocomplete="off">
                            <span>kg</span>
                        </div>
                        <small class="error" id="weightError"></small>
                    </div>

                    <div class="field">
                        <label for="height" data-i18n="heightLabel">قد</label>
                        <div class="input-wrap">
                            <input id="height" type="number" min="0.5" max="2.5" step="0.01"
                                   placeholder="مثلاً 1.75" data-placeholder="heightPlaceholder"
                                   autocomplete="off">
                            <span>m</span>
                        </div>
                        <small class="hint" data-i18n="heightHint">قد را بر حسب متر وارد کنید.</small>
                        <small class="error" id="heightError"></small>
                    </div>
                </div>

                <div class="actions">
                    <button class="primary-btn" type="submit" data-i18n="calculate">محاسبه BMI</button>
                    <button class="reset-btn" id="resetBtn" type="button" data-i18n="reset">پاک کردن</button>
                </div>
            </form>

            <section class="result hidden" id="result" aria-live="polite">
                <div class="result-top">
                    <div>
                        <span class="result-label" data-i18n="yourBmi">BMI شما</span>
                        <strong id="bmiValue">--</strong>
                    </div>
                    <span class="status-badge" id="statusBadge">--</span>
                </div>

                <div class="scale">
                    <div class="scale-track">
                        <span class="marker" id="marker"></span>
                    </div>
                    <div class="scale-labels">
                        <span data-i18n="underweight">کمبود وزن</span>
                        <span data-i18n="normal">نرمال</span>
                        <span data-i18n="overweight">اضافه وزن</span>
                        <span data-i18n="obesity">چاقی</span>
                    </div>
                </div>

                <p class="result-message" id="resultMessage"></p>
            </section>
        </section>

        <section class="info-grid">
            <article><strong>&lt; 18.5</strong><span data-i18n="underweight">کمبود وزن</span></article>
            <article><strong>18.5 – 24.9</strong><span data-i18n="normal">وزن نرمال</span></article>
            <article><strong>25 – 29.9</strong><span data-i18n="overweight">اضافه وزن</span></article>
            <article><strong>30+</strong><span data-i18n="obesity">چاقی</span></article>
        </section>

        <footer>
            <span>BMI Calculator</span>
            <span data-i18n="footer">ساخته‌شده با HTML، CSS و JavaScript</span>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
