<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Digital Clock and Stopwatch built with HTML, CSS and JavaScript.">
<title>Digital Clock & Stopwatch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><p class="eyebrow">JavaScript Project</p><h1 data-i18n="title">Digital Clock & Stopwatch</h1></div>
  <div class="controls">
    <button id="languageBtn" class="control-btn" type="button">FA</button>
    <button id="themeBtn" class="control-btn" type="button">☾</button>
  </div>
</header>

<main class="container">
<section class="card">
  <div class="heading"><span class="badge" data-i18n="live">LIVE</span><h2 data-i18n="currentTime">Current Time</h2></div>
  <div id="clock" class="clock">00:00:00</div>
  <div id="date" class="date">Monday, January 1, 2026</div>
</section>

<section class="card">
  <div class="heading"><span class="badge secondary" data-i18n="timer">TIMER</span><h2 data-i18n="stopwatch">Stopwatch</h2></div>
  <div id="stopwatch" class="stopwatch">00:00:00.00</div>
  <div class="buttons">
    <button id="startBtn" class="primary" type="button" data-i18n="start">Start</button>
    <button id="pauseBtn" type="button" data-i18n="pause">Pause</button>
    <button id="resetBtn" type="button" data-i18n="reset">Reset</button>
  </div>
  <div class="laps-header"><h3 data-i18n="laps">Lap Times</h3><button id="lapBtn" class="small-btn" type="button" data-i18n="lap">Lap</button></div>
  <div id="emptyLaps" class="empty" data-i18n="noLaps">No lap times yet.</div>
  <ol id="laps" class="laps"></ol>
</section>
</main>

<footer><p>Built with HTML, CSS & JavaScript • <span data-i18n="footer">Part of my JavaScript learning journey</span> 🚀</p></footer>
<script src="script.js"></script>
</body>
</html>
